name: Recovery G0 — full-project quality gate

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: recovery-g0-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    # Required branch-protection check: unique across all workflows.
    # Keep the job id for internal compatibility; only the check-run display
    # name changes. Do not require the path-filtered ECB/BoJ 'verify' job.
    name: recovery-g0-verify
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 (official tag commit, 2026-10-12)
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4 (official tag commit, 2026-10-12)
        with:
          node-version: '24.21.0'
          cache: npm
      - name: Install locked dependencies
        id: install
        run: npm ci
      - name: Inventory every unit test
        if: ${{ always() && steps.install.outcome == 'success' }}
        run: npm test -- --list
      # Run all checks even if one fails, to preserve a complete baseline.
      # Do NOT treat baseline failures as passes or suppress any files.
      - name: TypeScript typecheck
        id: typecheck
        if: ${{ always() && steps.install.outcome == 'success' }}
        run: npm run typecheck
      - name: All TypeScript tests
        id: test
        if: ${{ always() && steps.install.outcome == 'success' }}
        run: npm run test
      - name: AST import boundary regression check
        id: architecture
        if: ${{ always() && steps.install.outcome == 'success' }}
        run: npm run architecture:check
      - name: Lint
        id: lint
        if: ${{ always() && steps.install.outcome == 'success' }}
        run: npm run lint
      - name: Next.js build
        id: build
        if: ${{ always() && steps.install.outcome == 'success' }}
        run: npm run build
      - name: Enforce quality gate
        if: always()
        env:
          TYPECHECK: ${{ steps.typecheck.outcome }}
          TEST: ${{ steps.test.outcome }}
          ARCHITECTURE: ${{ steps.architecture.outcome }}
          LINT: ${{ steps.lint.outcome }}
          BUILD: ${{ steps.build.outcome }}
        shell: bash
        run: |
          printf 'G0: typecheck=%s tests=%s architecture=%s lint=%s build=%s\n' "$TYPECHECK" "$TEST" "$ARCHITECTURE" "$LINT" "$BUILD"
          [[ "$TYPECHECK" == success && "$TEST" == success && "$ARCHITECTURE" == success && "$LINT" == success && "$BUILD" == success ]] || exit 1
