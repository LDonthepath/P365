name: Verify ECB / BoJ FRED data acquisition

on:
  pull_request:
    paths:
      - "lib/data/macro-registry.ts"
      - "lib/domain/observation-semantics.ts"
      - "lib/application/fred-**"
      - "lib/data/fred-**"
      - "scripts/ops/data_ecb_boj_fred_rpc_allowlist.sql"
      - "scripts/ops/obs_fred_001g_install_rpc.sql"
      - ".github/workflows/verify-data-ecb-boj.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Provide Next.js server-only sentinel for direct Node tests
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/node_modules/server-only"
          echo "module.exports = {};" > "$RUNNER_TEMP/node_modules/server-only/index.js"
          echo "NODE_PATH=$RUNNER_TEMP/node_modules" >> "$GITHUB_ENV"
      - name: FRED selector, canonical receipt, and history tests
        run: npx --yes tsx@4.20.6 --test lib/application/fred-release-aware-selection.test.ts lib/application/fred-provider-update-selection.test.ts lib/data/fred-transactional-receipt.test.ts lib/application/fred-selective-forward.test.ts
      - name: Durable ECB BoJ read-model and briefing UI
        run: npx --yes tsx@4.20.6 --test lib/application/central-bank-balance-sheets.test.ts lib/application/briefing-central-bank-balance-sheets.test.ts lib/application/briefing-visual-hierarchy.test.ts
      - name: Native FRED observation/backfill adapter tests
        run: npx --yes tsx@4.20.6 lib/data/fred-observation-pages.test.ts
      - name: Semantic invariants
        run: npx --yes tsx@4.20.6 lib/domain/observation-semantics.test.ts
      - name: Normalization invariants
        run: npx --yes tsx@4.20.6 lib/domain/normalize-semantics.test.ts
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
